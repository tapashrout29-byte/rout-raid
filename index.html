<!DOCTYPE html>
<html>
<head>
<title>Rout Raid</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
    padding: 20px;
}

.logo {
    font-size: 45px;
    font-weight: bold;
    color: #ff6600;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    max-width: 400px;
    margin: auto;
}

.vehicle {
    display: flex;
    justify-content: space-around;
    margin: 20px;
}

.vehicle button {
    background: #fff;
    border: 2px solid #ff6600;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
}

input {
    width: 90%;
    padding: 12px;
    margin: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.book {
    background: #ff6600;
    color: white;
    border: none;
    padding: 15px 35px;
    border-radius: 10px;
    font-size: 18px;
}

</style>
</head>

<body>

<div class="logo">🚗 Rout Raid</div>

<h2>Your Local Ride App</h2>

<div class="card">

<h3>Choose Your Ride</h3>

<div class="vehicle">
<button>🏍️ Bike</button>
<button>🛺 Auto</button>
<button>🚗 Car</button>
</div>

<input placeholder="Pickup Location">

<input placeholder="Drop Location">

<button class="book">Book Ride</button>

</div>

<p>Fast & Easy Local Rides</p>

</body>
</html>
