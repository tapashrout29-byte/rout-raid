<!DOCTYPE html>
<html>
<head>
<title>Rout Raid</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f7f7f7;
}

.header{
    background:#ff6600;
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
}

.header h1{
    font-size:40px;
    margin:0;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px #ddd;
    margin-top:20px;
}

.ride{
    display:flex;
    gap:10px;
}

.ride div{
    flex:1;
    background:#fff3e8;
    padding:15px;
    border-radius:15px;
    font-size:18px;
}

input{
    width:90%;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid #ddd;
}

button{
    width:100%;
    padding:15px;
    background:#ff6600;
    color:white;
    border:none;
    border-radius:15px;
    font-size:18px;
}

.features{
    display:flex;
    justify-content:space-around;
    margin-top:20px;
}

.features p{
    font-size:14px;
}

</style>

</head>

<body>

<div class="header">
<h1>🚗 Rout Raid</h1>
<p>Your Local Ride Partner</p>
</div>

<div class="container">

<div class="card">

<h2>Book Your Ride</h2>

<div class="ride">
<div>🏍️<br>Bike</div>
<div>🛺<br>Auto</div>
<div>🚗<br>Car</div>
</div>

<br>
<input placeholder="Your Name">
<input placeholder="Mobile Number">
<input placeholder="Pickup Location">

<input placeholder="Drop Location">

<button onclick="bookRide()">Book Now</button>

</div>


<div class="card">

<h3>Why Rout Raid?</h3>

<div class="features">
<p>⚡ Fast</p>
<p>🛡️ Safe</p>
<p>📍 Local</p>
</div>

</div>

</div>
<script>
function bookRide(){

let pickup = document.querySelectorAll("input")[0].value;
let drop = document.querySelectorAll("input")[1].value;

if(pickup=="" || drop==""){
alert("Please enter Pickup and Drop location");
}
else{
alert("Your Rout Raid booking request has been received!");
}

}
</script>

</body>
</html>
</body>
</html>
