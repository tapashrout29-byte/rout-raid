<!DOCTYPE html>
<html>
<head>
<title>Rout Raid</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
    padding: 30px;
}

h1 {
    color: #ff6600;
    font-size: 45px;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 15px;
    max-width: 350px;
    margin: auto;
}

input {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: #ff6600;
    color: white;
    padding: 15px 30px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
}
</style>

</head>

<body>

<h1>Rout Raid</h1>
<h2>Your Local Ride App</h2>

<div class="box">

<h3>Book Your Ride</h3>

<input type="text" placeholder="Pickup Location">

<input type="text" placeholder="Drop Location">

<input type="tel" placeholder="Mobile Number">

<br>

<button>Book Ride</button>

</div>

</body>
</html>
